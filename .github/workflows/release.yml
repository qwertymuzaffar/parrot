# Builds the installers for macOS (Apple Silicon and Intel), Windows and Linux when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0), and attaches them to a draft release to review and publish.
# Each installer is also uploaded under a fixed name (Parrot-macOS-Apple-chip.dmg, ...), which the download page (docs/)
# links to through releases/latest/download/, so a new release needs no change to the page. Publish the draft only when
# the last job (check) passed. Actions are pinned to commit SHAs (Dependabot keeps them current) and the downloaded
# ONNX Runtime is checksummed, since what they bring in ends up in the installers.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          # Intel Macs: cross-built on Apple Silicon, with Microsoft's ONNX Runtime 1.23.2 (the last Intel build) inside
          - platform: macos-latest
            args: --target x86_64-apple-darwin --config src-tauri/tauri.intel.conf.json
          # ONNX Runtime's ready-made Linux build needs glibc 2.38+ (Ubuntu 24.04 and other 2024+ systems)
          - platform: ubuntu-24.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Linux libraries
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake clang libclang-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: ONNX Runtime for Intel Macs
        if: contains(matrix.args, 'x86_64-apple-darwin')
        run: |
          curl -sSL -o ort.tgz https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-x86_64-1.23.2.tgz
          echo "d10359e16347b57d9959f7e80a225a5b4a66ed7d7e007274a15cae86836485a6  ort.tgz" | shasum -a 256 -c -
          tar xzf ort.tgz && rm ort.tgz
          mv onnxruntime-osx-x86_64-1.23.2 .ort-intel
          echo "ORT_LIB_LOCATION=$PWD/.ort-intel/lib" >> $GITHUB_ENV
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=13.4" >> $GITHUB_ENV

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Parrot v__VERSION__
          releaseBody: See the assets below for macOS, Windows and Linux, or the download page at https://qwertymuzaffar.github.io/parrot/.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload under fixed names for the download page
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          b=src-tauri/target
          mkdir -p fixed
          case "${{ matrix.platform }}" in
            macos-latest)
              if [[ "${{ matrix.args }}" == *x86_64* ]]; then
                cp $b/x86_64-apple-darwin/release/bundle/dmg/*.dmg fixed/Parrot-macOS-Intel.dmg
              else
                cp $b/aarch64-apple-darwin/release/bundle/dmg/*.dmg fixed/Parrot-macOS-Apple-chip.dmg
              fi ;;
            windows-latest)
              cp $b/release/bundle/nsis/*-setup.exe fixed/Parrot-Windows-setup.exe
              cp $b/release/bundle/msi/*.msi fixed/Parrot-Windows.msi ;;
            ubuntu-24.04)
              cp $b/release/bundle/appimage/*.AppImage fixed/Parrot-Linux.AppImage
              cp $b/release/bundle/deb/*.deb fixed/Parrot-Linux.deb ;;
          esac
          gh release upload "$tag" fixed/* --clobber

  # Every file the download page links to, under its fixed name. With fail-fast off, one platform can fail while the
  # others upload, and publishing that draft would break releases/latest/download/ for the missing file.
  check:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check that every fixed-name file is in the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          have="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          missing=0
          for name in Parrot-macOS-Apple-chip.dmg Parrot-macOS-Intel.dmg Parrot-Windows-setup.exe Parrot-Windows.msi \
                      Parrot-Linux.AppImage Parrot-Linux.deb; do
            if grep -qxF "$name" <<< "$have"; then
              echo "found $name"
            else
              echo "::error::$name is missing from the $tag release: do not publish it until it is uploaded"
              missing=1
            fi
          done
          exit $missing
