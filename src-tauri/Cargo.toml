[package]
name = "parrot"
version = "0.3.0"
description = "Read a text aloud and see which words came out wrong"
authors = ["Muzaffar Qosimov"]
license = "MIT"
repository = "https://github.com/qwertymuzaffar/parrot"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "parrot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# the program file is named Parrot, so the Dock and the app switcher say Parrot, not parrot
[[bin]]
name = "Parrot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
# the speech engine
# the ONNX Runtime 1.23 API is all Parrot needs, and 1.23 is the last release Microsoft built for Intel Macs
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "copy-dylibs", "api-23"] }
ndarray = "0.17"
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
similar = "3.2"
sha1 = "0.11"
# to check a downloaded model is the file it should be
sha2 = "0.10"
flate2 = "1.1"
chrono = "0.4"
regex = "1.13"

# whisper.cpp: on macOS on the graphics chip (Metal), elsewhere on the processor
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"
